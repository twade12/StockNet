<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- Icon background -->
  <rect x="2" y="2" width="76" height="76" rx="12" fill="#0F172A"/>

  <!-- Connection lines: hub to device nodes -->
  <g stroke="#334155" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="40" x2="40" y2="16"/>
    <line x1="40" y1="40" x2="61" y2="28"/>
    <line x1="40" y1="40" x2="61" y2="52"/>
    <line x1="40" y1="40" x2="40" y2="64"/>
    <line x1="40" y1="40" x2="19" y2="52"/>
    <line x1="40" y1="40" x2="19" y2="28"/>
  </g>

  <!-- Device nodes (SmartCounters) -->
  <circle cx="40" cy="16" r="5" fill="#F59E0B"/>
  <circle cx="61" cy="28" r="5" fill="#F59E0B"/>
  <circle cx="61" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="40" cy="64" r="5" fill="#F59E0B"/>
  <circle cx="19" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="19" cy="28" r="5" fill="#F59E0B"/>

  <!-- Central hub (server) -->
  <circle cx="40" cy="40" r="10" fill="#1D4ED8"/>
  <circle cx="40" cy="40" r="5.5" fill="#93C5FD"/>

  <!-- Wordmark -->
  <text x="96" y="46"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="34" font-weight="700" fill="#0F172A" letter-spacing="-0.5">StockNet</text>

  <!-- Tagline -->
  <text x="97" y="63"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#64748B" letter-spacing="1.8" font-weight="500">IOT INVENTORY MANAGEMENT</text>
</svg>
