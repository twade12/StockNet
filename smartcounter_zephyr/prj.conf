#
# Smart Counter — application Kconfig fragment
#
# Each CONFIG_* line below is a Kconfig symbol the Zephyr build system
# consumes to enable a subsystem, driver, or feature. This file is the
# Zephyr analogue of the per-sketch #defines and library #includes at
# the top of the Arduino source.
#

# ---------------------------------------------------------------
# General
# ---------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_CPLUSPLUS=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_REBOOT=y

# ---------------------------------------------------------------
# Threads, work queues, events
# (Zephyr replacement for ad-hoc volatile flags + loop() polling)
# ---------------------------------------------------------------
CONFIG_EVENTS=y
CONFIG_POLL=y

# ---------------------------------------------------------------
# GPIO + ADC + I2C  (buttons, battery sense, OLED bus)
# ---------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=n
CONFIG_I2C=y

# ---------------------------------------------------------------
# Display: SSD1306 over I2C, character framebuffer ("CFB") for text
# ---------------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# ---------------------------------------------------------------
# Sensors (internal die temperature on ESP32-S3)
# ---------------------------------------------------------------
CONFIG_SENSOR=y

# ---------------------------------------------------------------
# Bluetooth: peripheral with Nordic UART Service (NUS)
# ---------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SC-01"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y

# Increase MTU so a full GET reply fits in fewer notifications
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# Vanilla Zephyr NUS service. In nRF Connect SDK swap for
# CONFIG_BT_NUS=y from <bluetooth/services/nus.h>.
CONFIG_BT_ZEPHYR_NUS=y

# ---------------------------------------------------------------
# Networking: WiFi + sockets + HTTP client + TLS
# ---------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y

CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_DNS_RESOLVER=y

CONFIG_HTTP_CLIENT=y

# TLS for HTTPS POST. mbedTLS is the standard backend on Zephyr.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# ---------------------------------------------------------------
# JSON (replaces ArduinoJson)
# ---------------------------------------------------------------
CONFIG_JSON_LIBRARY=y

# ---------------------------------------------------------------
# Settings + NVS (replaces Preferences.h)
# ---------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---------------------------------------------------------------
# Power management & deep sleep
# (Zephyr "soft off" + GPIO/timer wake — replaces esp_deep_sleep_start)
# ---------------------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# ---------------------------------------------------------------
# Retained RAM (replaces RTC_DATA_ATTR boot counter)
# ---------------------------------------------------------------
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=n

# ---------------------------------------------------------------
# Application Kconfig knobs (declared in ./Kconfig)
# ---------------------------------------------------------------
CONFIG_SMARTCOUNTER_DEFAULT_POST_INTERVAL_SEC=3600
CONFIG_SMARTCOUNTER_DEFAULT_DISPLAY_TIMEOUT_SEC=15
